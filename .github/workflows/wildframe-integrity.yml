name: Wildframe source integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out playable game
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check large HTML source and parse inline game scripts
        run: node tests/source-integrity.cjs
