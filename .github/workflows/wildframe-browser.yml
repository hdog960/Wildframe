name: Wildframe browser visual smoke
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/browser-smoke.cjs'
      - 'assets/v3/**.png'
      - 'assets/v3/**.svg'
      - '.github/workflows/wildframe-browser.yml'
  workflow_dispatch:

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free browser test dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Boot game in Chromium and capture iPhone-size scenes
        run: node tests/browser-smoke.cjs
      - name: Upload real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wildframe-browser-screenshots
          path: artifacts/browser/*.png
          if-no-files-found: ignore
          retention-days: 7
